<!doctype html>
<html>
    <head>
        <meta
            name="viewport"
            content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <!-- full screen button-->

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bungee+Inline&family=Orbitron:wght@400..900&display=swap"
            rel="stylesheet"
        />
        <!-- <script src="https://cdn.jsdelivr.net/npm/poly-decomp@0.2.1/build/decomp.min.js"></script> -->
        <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script> -->
        <!-- <script src="decomp.min.js" type="text/javascript"></script> -->
        <!-- <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script> -->
    </head>
    <body>
        <div id="container"></div>

        <button
            id="fullscreen"
            onclick="(
                    function () {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().then (() => {
                            document.getElementById('fullscreen_img').src = './closefullscreen.svg';
                        })
                    } else if (document.exitFullscreen) {
                        document.exitFullscreen().then(() => {
                            document.getElementById('fullscreen_img').src = './fullscreen.svg';
                        })
                    }

                })()"
        >
            <image id="fullscreen_img" src="./fullscreen.svg"></image>
        </button>

        <button id="menu">
            <image id="menu_img" src="./menu.svg"></image>
        </button>
        <!-- <canvas width="1024" height="480" id="canvas1"></canvas> -->
        <script src="./matter.min.js"></script>
        <script src="./glutils.js"></script>
        <script src="./shaders.js"></script>
        <script src="levels.js"></script>
        <script src="./resources.js"></script>
        <script defer src="./menu.js"></script>
        <script defer src="./main.js"></script>
        <style>
            body,
            canvas {
                padding: 0;
                outline: none;
                margin: 0;
                overflow: hidden;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                background-color: black;
            }

            #container {
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
            }

            canvas {
                width: 100%;
                height: 100%;
            }

            #fullscreen {
                position: absolute;
                top: 0.1rem;
                right: 0.1rem;
                z-index: 100;
                background-color: transparent;
                color: white;
                border: none;
                padding: 0.3px;
                cursor: pointer;
                display: grid;
                place-items: center;
            }

            #menu {
                position: absolute;
                bottom: 0.5rem;
                right: 0.5rem;
                z-index: 100;
                background-color: transparent;
                color: white;
                border: none;
                padding: 0.3rem;
                cursor: pointer;
                display: grid;
                place-items: center;
            }

            #menu img {
                width: 4rem;
                height: 4rem;
                pointer-events: none;
            }

            #fullscreen img {
                width: 2rem;
                height: 2rem;
            }
        </style>
    </body>
</html>
